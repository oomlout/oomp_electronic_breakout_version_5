  mm holes in STAND-OFF packages, giving centred locations (10.16,10.16), (-10.16,10.16),
  (10.16,-10.16) mm. The other six drilled candidates are J3:pad:1..4 and J4:pad:1..2,
  1.016 mm plated through-hole connector contacts at y=-11.43 mm; they are explicitly
  excluded because their package/element references place them in the 0.1-inch header
  footprints, not board mounting features. Full drill count is nine and all candidates
  were inspected.'
