derivation: Manufacturer Dimension V1.0.0 drawing gives PCB outline 25.4 x 34.3 mm; two 2.0 mm drills; 20.4 mm center-to-center horizontal spacing; and 2.5 mm from the left edge to the left drill center. The dimensioned values imply centred x coordinates -10.2 mm and +10.2 mm. The drawing provides no vertical dimension locating the hole row relative to the PCB bounding box. Do not infer y coordinates from the illustration's scale or symmetry; geometry is incomplete and not promotable.
