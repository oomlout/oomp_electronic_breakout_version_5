derivation: 'Drawing page 6 labels the XIAO ESP32C3 board outline 17.8 mm wide by
  21.0 mm tall, dimensions in mm; these nominal manufacturer dimensions define the
  output bounding box. The archived v1.3 KiCad board outline independently measures
  20.955 mm along native X and 17.78 mm along native Y (x max-min and y max-min from
  the complete Edge.Cuts contour). KiCad native X is rotated into canonical top view
  by 90 degrees CCW: (x_c,y_c)=(-(y-y_cad_center), x-x_cad_center); this maps the
  USB-C connector at positive native X to positive canonical Y (towards top), swaps
  the extents, and keeps canonical X right/Y up. The manufacturer drawing rounds these
  extents to 17.8 x 21.0 mm. Reviewed every through-drill candidate in the full CAD:
  J1/J2 are electrical castellated/header pads, USB0 drills are connector shield anchors,
  and BOOT0/RST0 drills are button-footprint actuation/retention features; none are
  board mounting holes. No other drilled pads or board mounting-hole features are
  present. Thus the mounting pattern is explicitly empty.'
