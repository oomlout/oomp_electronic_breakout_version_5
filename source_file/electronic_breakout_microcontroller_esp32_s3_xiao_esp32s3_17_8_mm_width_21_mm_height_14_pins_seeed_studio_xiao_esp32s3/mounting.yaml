attempts:
- avenue: Official Seeed base-board dimension drawing
  result: Downloaded the official XIAO ESP32S3 v1.1 dimension DXF linked by Seeed's
    guide. Visual review shows a rear-side drawing and two small circular features;
    the drawing's layer 20 circles have radius 0.3 mm at raw DXF coordinates (5.365,
    29.548) and (11.145, 29.548). They are too small for the standard holder and the
    drawing does not identify whether they are tooling, electrical, or mounting features.
    No hole pattern was extracted.
  gap: Cannot establish the exact function of the two circles or prove the complete
    base carrier's mountable hole pattern from this dimension drawing alone.
- avenue: Official Seeed-linked carrier CAD archive
  result: Downloaded the ZIP currently linked as the base XIAO ESP32-S3 KiCad project.
    Its archive folder is 202003753_XIAO ESP32S3 Sense_v1.5 and the PCB is titled
    XIAO ESP32S3_V1.5 with Sense camera/B2B circuitry, so it is not the assigned base-board
    carrier.
  gap: Current official CAD link has a carrier identity mismatch and cannot establish
    mounting features for the base XIAO ESP32-S3.
- avenue: Seeed-Studio-owned OPL KiCad library board
  result: Downloaded and pinned Seeed-Studio/OPL_Kicad_Library commit 5cb639feaf5ddbce9c253f016abd98c597a53e3f,
    file Seeed Studio XIAO ESP32S3/ESP32S3.kicad_pcb. The board silkscreen says XIAO
    ESP32S3; its USB0 footprint is USB2.0-TYPE-C UBF31-0171 and contains exactly two
    0.58 mm NPTH pads. This explains the two 0.6 mm circles in the v1.1 drawing as
    USB connector holes, not PCB mounting holes. However, the file has no board revision
    identifier and is not the exact PCB member linked from the product guide, so it
    cannot prove the assigned base carrier's full mounting pattern for a specific
    revision.
  gap: Need a manufacturer source linking this base-board PCB file (or a complete
    mechanical drawing) to the exact assigned base carrier revision; the current product-guide
    CAD link resolves to the Sense project and the separate OPL CAD has no revision
    metadata.
conflicts: []
notes:
- Official Seeed guide distinguishes the base XIAO ESP32-S3 from XIAO ESP32-S3 Sense.
  The base v1.1 DXF's two 0.6 mm circles match the pair of 0.58 mm non-plated holes
  inside the Type-C receptacle footprint in the Seeed-owned OPL CAD; they are connector
  features, not board mounting holes. The current product-guide CAD link resolves
  to the Sense project, and the separate OPL board has no revision identifier or direct
  product-guide link. This leaves a carrier/revision identity gap, so the OPL file
  cannot be used to assert a complete base-board mounting pattern.
- No geometry was extracted; board_size and mounting_holes remain unknown. No-hole
  status is not established. Resume when Seeed links revision-identified base-board
  CAD or a complete mechanical drawing to the assigned base carrier revision.
