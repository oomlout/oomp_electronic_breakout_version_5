    variant: XIAO_ESP32S3
    variant_scope: board_variant
    api: null
    peripheral: null
    source_ids:
    - interface_variant
    - interface_board_selection
    - interface_runtime_uart
    tx_gpio: 43
    rx_gpio: 44
    pin_keys:
      tx:
      - expansion_D6
      rx:
      - expansion_D7
    signal_status:
      tx: mapped
      rx: mapped
    notes:
    - UART GPIOs are distinct from USB CDC/USB Serial. The meaning of Serial depends on the core and USB
      build settings.
    - TX/RX are board variant aliases. Pass the GPIOs explicitly to the selected HardwareSerial instance;
      no-argument pin selection can use SoC UART defaults instead.
