- '2026-11-07: Rechecked current Adafruit product 163 page and latest manufacturer CAD
  master commit 4b5be6d232f7f1de1bc2717aa0a4d334c16a64d9. The official page says the
  November 2022 update is silkscreen-only and old/new editions are otherwise identical;
  the current EAGLE board file is byte-for-byte identical to the pinned archived CAD.
  Its complete drill inspection again shows only the two 2.0 mm mounting holes and
  seven 1.0 mm header drills; no compatible alternate carrier revision is evidenced.'
conflicts:
- 'Mechanical holder policy conflict: both manufacturer CAD mounting drills are 2.0
  mm diameter. The standard holder requires at least 0.2 mm diametral clearance and
  supports no screw smaller than M2, so it cannot generate this board’s holder. A
  custom small-screw/retention design requires review; no screw or geometry was guessed.'
notes:
- Evidence files were downloaded and registered on 2026-11-07. The product page gives
  nominal 19 x 19 mm dimensions; CAD extraction yields 19.0554 x 19.0502 mm, consistent
  with the nominal values.
- 'Current master CAD commit 4b5be6d232f7f1de1bc2717aa0a4d334c16a64d9 has the same SHA-256
  and exact drill geometry as the previously pinned CAD. The official product revision
  history identifies only a silkscreen update, so the board remains unsupported by the
  standard holder: 2.0 mm PCB drills are below the 2.2 mm minimum for an M2 screw with
  0.2 mm diametral clearance.'
- The mounting helper preview failed before writing a preview image because standard_holder
