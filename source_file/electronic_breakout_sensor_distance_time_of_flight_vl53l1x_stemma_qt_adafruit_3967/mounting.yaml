derivation: 'Pinned EAGLE 9.6.2 board file at the recorded Adafruit commit. Layer
  20 wires form the complete outline, including four 2.54 mm-radius corner arcs; native
  bounds are x=0..25.4 mm and y=0..17.78 mm. Centre is (12.7, 8.89) mm. EAGLE native
  top-view +X right/+Y up; transform each selected drill by x_mm=x_native-12.7, y_mm=y_native-8.89,
  with quarter-turn 0 (no axis rotation or mirroring). The four selected package pads
  have EAGLE drill=2.5 mm and centres (2.54,15.24), (22.86,15.24), (2.54,2.54), (22.86,2.54),
  yielding centred (±10.16,±6.35) mm. Full drill inspection found ten candidates:
  these four explicit MOUNTINGHOLE_2.5_PLATED pads and JP2 header pads 1-6, each 1.0
  mm drill; JP2 are electrical header contacts and are excluded. The selected-hole
  preview was checked against the CAD candidate list and top-view frame.'
