identity_evidence: Adafruit product 3967 is the VL53L1X/VL53L1CX STEMMA QT distance
  sensor board. The official product page and guide Downloads page identify the EagleCAD
  files; the official Adafruit-VL53L1X-PCB README names the same product and links
  product 3967. The pinned board file is named 'Adafruit VL53L1X.brd', has board attribute
  REV B, and silkscreen labels VL53L1X and VL53L1CX. Its U1 value field says VL53L0X,
  an apparent stale component label; the explicit board filename, manufacturer repository
  linkage, product identity and silkscreen resolve carrier identity. This electrical
  label inconsistency does not affect outline or drill geometry.
