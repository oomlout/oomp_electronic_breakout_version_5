derivation: 'The complete layer 20 Dimension outline in the pinned Adafruit_SCD-41.brd
  is a rounded rectangle with native extents X=0..25.4 mm and Y=0..22.86 mm, including
  four R2.54 mm corners, giving the bounding-box dimensions 25.4 x 22.86 mm. Coordinates
  are native EAGLE mm in top view. Transform to the canonical centred frame with x_mm
  = x_native - 12.7 mm and y_mm = y_native - 11.43 mm; no mirroring or quarter-turn
  is applied (0 CCW). Reviewed all nine drilled candidates: four named MOUNTINGHOLE_3.0_PLATEDTHIN
  package pads at native (2.54,20.32), (22.86,20.32), (2.54,2.54), and (22.86,2.54),
  each with a 3.0 mm plated PCB drill, are board mounting features. The other five
  are the 1.0 mm plated JP2 1x05 header drills along the bottom edge and are excluded
  as electrical header pads. No other drills are present in this CAD.'
