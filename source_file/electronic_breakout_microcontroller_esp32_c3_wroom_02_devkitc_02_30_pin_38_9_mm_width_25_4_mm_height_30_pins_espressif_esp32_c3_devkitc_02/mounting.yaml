derivation: 'The complete official dimension sheet labels the PCB bounding box 25.40 mm wide and 38.91
  mm high. The drawing is a top view with the Micro-USB connector at the lower end; map x right and y
  up, translating the lower-left outline bound (0,0) to the centred origin (12.70,19.455 mm): x_center
  = x_drawing - 12.70 mm and y_center = y_drawing - 19.455 mm. No rotation, reflection or axis swap is
  applied. Thus the USB connector is at negative Y. This resolves the seeded context note that incorrectly
  states USB at positive Y. The full dimension sheet and all six pages of the exact V1.1 PCB layout were
  reviewed. The thirty plated through-hole pads are the two 15-position headers. The large drilled/metallic
  features by the lower USB end are connector retaining anchors and contacts, not board mounting holes;
  remaining small drill/via and module features are likewise not mounting holes. The small circle appearing
  at the upper edge of the dimension sheet is not present as a hole in the full board layout view and
  is a drawing mark. No designated board mounting holes are shown in the complete carrier evidence.'
