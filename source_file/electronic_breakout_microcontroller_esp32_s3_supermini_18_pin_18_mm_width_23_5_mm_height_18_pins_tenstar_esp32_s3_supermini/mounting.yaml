    dimensions but no dimensioned mounting-hole locations or drill sizes. The page
    does not identify a carrier revision. A direct requests retrieval on 2026-11-07
    returned HTTP 403 with a verification challenge, so no local evidence copy was
    archived; the accessible browser-rendered page was inspected.
  gap: The page supports the nominal outline only. It cannot establish exact carrier
    revision, mounting-hole geometry, or that the carrier has no mounting holes.
