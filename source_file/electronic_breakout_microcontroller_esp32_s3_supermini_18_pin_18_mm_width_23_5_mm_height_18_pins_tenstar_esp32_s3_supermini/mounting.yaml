    footprint with connector and underside contact pads, not the Tenstar carrier board
    CAD or its mechanical outline.
  gap: Cannot identify mounting holes or prove their absence from a package footprint
    that is not authoritative for this carrier.
- avenue: Recheck of TENSTAR-labeled series manual
  result: The currently browser-accessible TENSTAR ROBOT ESP32 SuperMini Development
