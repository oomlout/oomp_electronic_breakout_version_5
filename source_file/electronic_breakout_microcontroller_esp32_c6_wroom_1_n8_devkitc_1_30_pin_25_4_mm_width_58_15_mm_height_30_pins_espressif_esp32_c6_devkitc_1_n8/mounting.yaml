identity_evidence: Espressif’s official ESP32-C6-DevKitC-1 v1.2 guide identifies the N8 variant as using ESP32-C6-WROOM-1 with 8 MB SPI flash and links the v1.2 PCB layout, dimensions drawing and DXF. The official PCB layout title block reads ESP32-C6-DevKitC-1, Rev 1.2, dated 2023-01-11; the matching dimensions PDF and DXF filenames also identify v1.2.
