derivation: 'The complete official top-view dimensions sheet labels the carrier PCB outline 25.40 mm wide and 51.80 mm high. Taking the lower-left PCB outline bound as (0, 0), the centred top-view frame is x = X - 12.70 mm and y = Y - 25.90 mm; +X points right, +Y points toward the antenna end, and the USB connectors are at negative Y. No rotation, reflection or axis swap is applied. The complete dimensions sheet and all five pages of the exact Rev 1.2 PCB layout were reviewed. The 32 side-pad drills are header contacts; the two J5 drills are current-measurement jumper pads; the large oblong drills along the USB end are USB connector retaining/through-hole features; the many small drills are vias or component pads. None is a board mounting hole. No designated mounting-hole pattern or drill callout appears in the complete carrier evidence. The seeded mounting_context.json says USB is at positive Y; the official dimension drawing and complete PCB layout place USB at the lower end, so the canonical +Y-up top-view frame puts USB at negative Y.'
