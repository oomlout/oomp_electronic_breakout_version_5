notes:
- Pin numbers and net names follow manufacturer CAD; firmware aliases such as D3 are not GPIO numbers.
  Connector pad coordinates are solder-pad centres, not mating-contact positions.
- Physical contacts sharing a KiCad pad number are grouped under physical_contacts. Extra castellated
  Eagle pad numbers remain separate entries.
- Nominal XIAO outline is approximately 21 x 17.8 mm. Exact width/height here follow the supplied PCB
  revision; rounded corners and connector overhang are not bounding-box clearance models.
- Connector locator holes and PCB slots are not classified as screw mounting holes.
data_gaps:
- Assembled height and component keepout envelopes have not been captured.
