default_interfaces:
  uart:
    protocol: uart
    status: documented
    basis: framework_defaults
    framework: arduino-pico
    variant: seeed_xiao_rp2040
    variant_scope: board_variant
    api: Serial1
    peripheral: uart0
    source_ids:
    - interface_variant
    - interface_board_selection
    - interface_runtime_uart
    tx_gpio: 0
    rx_gpio: 1
    pin_keys:
      tx:
      - J2_7
      - J2_19
      rx:
      - J4_1
      - J4_13
    signal_status:
      tx: mapped
      rx: mapped
    notes:
    - UART GPIOs are distinct from USB CDC/USB Serial. The meaning of Serial depends on the core and USB
      build settings.
  i2c:
    protocol: i2c
    status: documented
    basis: framework_defaults
    framework: arduino-pico
    variant: seeed_xiao_rp2040
    variant_scope: board_variant
    api: Wire
    peripheral: i2c1
    source_ids:
    - interface_variant
    - interface_board_selection
    - interface_runtime_i2c
    sda_gpio: 6
    scl_gpio: 7
    pin_keys:
      sda:
      - J2_5
      - J2_17
      scl:
      - J2_6
      - J2_18
    signal_status:
      sda: mapped
      scl: mapped
    notes: []
  spi:
    protocol: spi
    status: documented
    basis: framework_defaults
    framework: arduino-pico
    variant: seeed_xiao_rp2040
    variant_scope: board_variant
    api: SPI
    peripheral: spi0
    source_ids:
    - interface_variant
    - interface_board_selection
    - interface_runtime_spi
    sck_gpio: 2
    mosi_gpio: 3
    miso_gpio: 4
    ss_gpio: null
    pin_keys:
      sck:
      - J4_2
      - J4_14
      mosi:
      - J4_4
      - J4_16
      miso:
      - J4_3
      - J4_15
      ss: []
    signal_status:
      sck: mapped
      mosi: mapped
      miso: mapped
      ss: not_defined
    notes:
    - ss is the framework chip-select alias/default, not an automatically asserted CS. Select and drive
      CS as required by the peripheral and library.
