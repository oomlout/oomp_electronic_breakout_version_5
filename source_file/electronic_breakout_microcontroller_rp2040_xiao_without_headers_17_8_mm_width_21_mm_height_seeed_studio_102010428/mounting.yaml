derivation: 'Drawing fallback: Seeed manufacturer PDF page 3 identifies SKU 102010428
  and gives nominal board dimensions 17.8 mm wide x 21 mm high, with the USB connector
  at the top. The current official Eagle v1.22 board layer 20 gives the complete outline
  bounds x=[-10.1016, 11] mm, y=[-8.89, 8.89] mm, hence native dimensions 21.1016
  x 17.78 mm. Center native CAD origin at (0.4492, 0) mm and rotate CCW 90 degrees:
  (x_top,y_top)=(-(y_native-0), x_native-0.4492); this yields canonical width=17.78
  mm, height=21.1016 mm, top view with USB at +Y. The PDF rounds these to 17.8 x 21
  mm. Full Eagle board has no board-level plain holes. Reviewed every drilled package
  feature: J2/J4 are 14-pin half-hole connector/header pads; USB1 has connector retention/shell
  anchors; RESET and BOOT have switch retention holes; J1 holes are shielding-cover
  retention anchors. These component/connector features are not board mounting holes.
  The complete v1.3 KiCad board archive is byte-verified against its extracted board
  and agrees on dimensions and feature roles. Eagle helper extraction was attempted
  but rejects the J1 footprint because it includes layer-20 geometry; dimensions and
  all candidates were therefore reviewed from the registered exact CAD plus the manufacturer
  dimension drawing.'
