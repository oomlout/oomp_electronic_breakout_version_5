identity_evidence: The official Seeed XIAO RP2040 product page distinguishes the standard
  RP2040 from the RP2040 Plus and publishes the 21 x 17.8 mm dimensions. Seeed SKU
  102010428 is explicit on drawing page 3. The official Wiki links the v1.22 Eagle
  project, whose board file identifies XIAO RP2040 v1.22; the archived manufacturer
  KiCad project names XIAO RP2040 v1.3. Both complete CAD files describe this carrier
  and agree on the board outline.
