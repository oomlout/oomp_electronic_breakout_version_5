derivation: The manufacturer Dimension V1.0.0 drawing specifies the 25.4 x 34.3 mm outline and shows two open circular candidate holes. The drawing gives 2.5 mm from the left board edge to the left centre and 20.4 mm centre spacing, so x_left = 2.5 - 25.4/2 = -10.2 mm and x_right = -10.2 + 20.4 = +10.2 mm. A 2.000 mm horizontal dimension is drawn across the right-hand candidate hole, supporting that hole's diameter only. The drawing does not dimension either candidate's vertical position relative to the PCB bounding box, and it does not explicitly state that the 2.000 mm callout applies to the left hole. No y coordinate or second diameter is inferred from illustration scale or apparent symmetry; the pattern is incomplete and cannot be promoted.
