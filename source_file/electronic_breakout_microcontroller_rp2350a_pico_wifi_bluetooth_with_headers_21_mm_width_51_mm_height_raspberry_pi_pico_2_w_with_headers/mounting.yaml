identity_evidence: Official Raspberry Pi Pico series documentation identifies Pico
  2 W with headers as a distinct RP2350 wireless/headered variant and states Pico
  2 W and Pico 2 W with headers share the same board layout. The Raspberry Pi Product
  Information Portal lists SC1633 and SC1634 under Pico 2 W and links its current
  datasheet. Thus the RP-008304-DS-3 Pico 2 W mechanical drawing applies to this headered
  variant; headers and the keyed debug connector are not changes to the PCB mounting
  pattern.
