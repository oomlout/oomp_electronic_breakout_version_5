attempts:
- source: Raspberry Pi official Pico series documentation
  result: 'Reviewed current wireless-variant section: explicitly lists Pico 2 W with
    headers and states its layout is the same as Pico 2 W; rechecked 2026-11-07 at
    https://www.raspberrypi.com/documentation/microcontrollers/pico-series.html.
    It also states the physical changes between Pico 2 W and the headered variant are
    presoldered headers and the keyed debug connector.'
- source: Raspberry Pi Pico 2 W Datasheet RP-008304-DS-3
  result: >-
    Downloaded current official PDF 2026-11-06; verified Figure 3 and its four
    drills against archived rendering reference/mechanical.png (matching archived
    SHA-256). Rechecked current Product Information Portal listing 2026-11-07: it
    links Release 2 (build date 03/07/2026, build d4e0f1799616, updated 15 Jul 2026);
    downloaded bytes are identical (SHA-256 8f519b945e9f7078ffd3fee464992fca376d8037ebcd1f83bd2a021241717eb2).
- source: mounting_research.py preview
  result: >-
    Standard holder preview rejected the 2.1 mm mounting drills as too small
    for the supported M2/M2.5/M3 screw policy. Rechecked 2026-11-07: minimum supported
    M2 clearance hole is 2.2 mm (2.0 mm nominal screw plus 0.2 mm diametral clearance);
    the specified 2.1 +/-0.05 mm drills are 0.05-0.15 mm below that minimum. Custom
    mechanical review is required; no promotion/generation attempted.
conflicts:
- issue: The documented 2.1 mm PCB drills are below the standard holder minimum for
    M2/M2.5/M3 fasteners with the required 0.2 mm or greater diametral clearance.
    No custom fastener/holder design is qualified in this workflow.
  evidence: 'Current manufacturer datasheet RP-008304-DS-3 Release 2 Figure 3 specifies
    four 2.1 mm (+/-0.05 mm) drilled holes. The smallest supported screw is nominal
    M2 with a 2.0 mm diameter and 0.2 mm diametral clearance, requiring a 2.2 mm drill;
    specified drills range 2.05-2.15 mm. Current standard preview reports: Drill too
    small for supported M2/M2.5/M3 screws; needs custom holder.'
notes:
- Datasheet mechanical specification describes the base PCB; prescribed headers and
  keyed debug connector are on the headered variant but do not alter the PCB outline/mounting
  drills.
- Connector/header features and component clearances are not part of the mounting
  hole selection. Component, connector, screw-head and underside clearance remain
  unverified.
- The official product documentation page was accessible via web search but direct
  requests returned HTTP 403; no access restriction was bypassed.
