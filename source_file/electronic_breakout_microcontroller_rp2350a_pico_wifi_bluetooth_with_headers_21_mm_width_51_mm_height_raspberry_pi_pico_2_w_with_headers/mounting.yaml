derivation: 'Manufacturer Figure 3 in RP-008304-DS-3 gives PCB outline 21 x 51 mm
  and four drilled mounting holes diameter 2.1 mm (+/-0.05 mm). It dimensions 11.4
  mm between hole columns and 2 mm from each short PCB edge to the adjacent mounting-hole
  centre. Centring on the PCB bounding box: x=(+/-11.4/2)=+/-5.7 mm; y=+/-(51/2-2)=+/-23.5
  mm. Frame transform: drawing top view is retained, X increases to the right, and
  source drawing Y from the USB end toward the antenna end is converted to canonical
  Y-up (USB at +Y); no quarter-turn or mirror. The headered variant has the same board
  layout per official Pico series documentation. Hole plating is unspecified by the
  datasheet, so null.'
