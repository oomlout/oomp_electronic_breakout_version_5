derivation: 'Figure 3 in the official Pico W datasheet shows a 21 mm by 51 mm top
  assembly with four 2.1 mm drilled mounting holes. Its horizontal callout gives 11.4
  mm between the two mounting-hole columns; relative to the board centre this is x
  = +/-11.4/2 = +/-5.7 mm. The drawing gives 2 mm from each short PCB edge to the
  corresponding mounting-hole row. In the required centred frame, y(top) = 51/2 -
  2 = +23.5 mm and y(bottom) = -(51/2 - 2) = -23.5 mm. The drawing''s USB connector
  overhang is excluded from the 21 x 51 mm PCB outline. Frame conversion: drawing
  top view retains x rightward; its down-page longitudinal direction is inverted to
  canonical y-positive-up. Hole drills are 2.1 mm, per datasheet text, not inferred
  from symbols. All four candidates are explicitly identified as drilled mechanical
  fixing holes; header drills and component features are excluded.'
