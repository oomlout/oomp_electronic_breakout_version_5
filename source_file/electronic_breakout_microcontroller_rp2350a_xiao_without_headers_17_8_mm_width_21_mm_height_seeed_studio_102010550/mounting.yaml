derivation: 'Seeed Studio official dimension DXF v1.0 uses $INSUNITS=4 (mm). In layer XIAORP2350-EDGE_CUTS_GBR, the complete rounded board perimeter spans raw CAD X=92.3966525931..113.3516525931 mm (20.955 mm) and raw CAD Y=-88.5547691833..-70.7747691833 mm (17.78 mm), corroborated by the DXF dimension entities reading 20.955 and 17.78. The drawing puts the USB connector on the +raw-X edge. To match the seeded top-view convention (USB at +Y), apply a counter-clockwise quarter-turn: x_canonical=-(Y_raw-(-79.6647691833)); y_canonical=X_raw-102.8741525931. This maps raw +X to canonical +Y, swaps the bounding dimensions to width=17.78 and height=20.955, and centres the PCB bounding box. The complete manufacturer KiCad board from the linked v1.0 archive was reviewed for every drill definition: the 0.70/0.85/0.889 mm drills belong to U2 castellated/header and debug contacts; the two 1.5 x 0.6 mm oval drills and two 0.65 mm NPTH drills belong to USB1 shell/connector anchoring. These are electrical/interface/connector features, not board mounting holes. The DXF contains no separate mounting-hole callout or unassigned mechanical bore. Therefore the manufacturer carrier evidence supports an empty board mounting pattern.'
