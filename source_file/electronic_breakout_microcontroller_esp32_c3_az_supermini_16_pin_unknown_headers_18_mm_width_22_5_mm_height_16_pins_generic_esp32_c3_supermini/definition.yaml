data_gaps:
- Nominal outline comes from the supplied OOMP catalogue; pad centres, PCB thickness and hole measurements
  remain null.
- User identifies the attached board as mini; SuperMini carrier revision and LED polarity have not been
  visually confirmed.
- The catalogue calls its chip FN4; esptool identifies this attached unit as C3 AZ revision v1.1. Chip
  taxonomy reflects the attached AZ.
- GPIO2/8/9 are reserved strapping/onboard controls. GPIO12-17 flash and GPIO18/19 USB are not offered.
- Only exposed GPIO0-10/20/21 exist in this profile. ADC controls use ADC1 GPIO0/1/3/4; GPIO5 ADC2 is
  omitted.
