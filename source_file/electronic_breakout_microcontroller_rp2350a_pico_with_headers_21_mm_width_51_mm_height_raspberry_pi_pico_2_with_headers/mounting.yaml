derivation: Figure 3, printed page 7, gives the 21 x 51 mm PCB, four drilled D2.1
  mm mounting holes, 5.7 mm lateral centre offsets and 2 mm end-edge offsets. Set
  the origin at the PCB bounding-box centre; top view with USB at +Y, X right and
  Y up. Thus x = ±5.7 mm and y = ±(51/2 - 2) = ±23.5 mm. The complete manufacturer
  STEP board solid has bounds x=±10.5 mm, y=±25.5 mm; its four cylindrical through-drills
  have radius 1.05 mm and centres exactly (±5.7, ±23.5) mm. Header drills and USB/other
  connector features are excluded.
