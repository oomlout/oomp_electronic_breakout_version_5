conflicts: []
notes:
- The drawing and complete CAD show four board mounting drills. The 1.0 mm GPIO through-holes
  and smaller pads/test/connector features were not selected as mounts.
- 'Exact hole geometry is supported, but this workflow’s standard screw-holder policy
  cannot use 2.1 mm drills: its M2 option requires at least 2.2 mm drill diameter.
  Rechecked against the current official RP2350 Pico 2 datasheet: the tolerance range
  is 2.05–2.15 mm, still below the 2.2 mm minimum. The exact Pico 2 H carrier STEP
  agrees; no exact-revision size change resolves the clearance. Needs coordinator/
  custom-holder decision; do not promote incomplete standard-holder evidence.'
- Standard holder geometry is not a physical fit test; connector, component, screw-head
  and underside clearances remain unverified.
