  in these sources.
identity_evidence: Raspberry Pi Product Information Portal identifies Pico 2 with
  headers as SC1632 and lists the exact Pico 2 H STEP model RP-009062-CA-2. Raspberry
  Pi Pico-series documentation describes Pico 2 and Pico 2 with headers as the same
  board layout with presoldered headers as the physical difference. The STEP model
  includes the presoldered headers and exact matching Pico 2 carrier outline.
