attempts:
- avenue: Pinned manufacturer CAD and repository history
  result: Found one EAGLE board-file revision, initial commit aa6f77ed69ab3c01bb7ae9af80b92f0cdd2f63ac.
    File hash matches the previously archived CAD exactly. README explicitly points
    to product 5426. Full drill review identifies USB-C connector anchors and 1X07_CASTEL
    pads only; no board mounting holes for this CAD revision.
- avenue: Official Adafruit QT Py ESP32-S3 guide
  result: 'Rechecked the archived guide and live official guide. It lists both products
    5426 and 5700, explicitly calls them two versions of this board, and its Downloads
    section links the QT Py ESP32-S3 EAGLE CAD repository. This is an official family-level
    CAD link, but does not say the pinned revision applies to both variants; repository
    README remains explicitly mapped to product 5426.'
- avenue: Official Adafruit product pages 5426 and 5700
  result: Confirmed separate product records for the two SKUs. No product 5700 mechanical
    drawing, direct CAD link, or explicit revision mapping establishing the same carrier
    geometry was located. The 5700 page describes its memory configuration but not a
    PCB revision.
- avenue: Official repository history and CAD discovery
  result: 'The pinned PCB repository has one discovered board-file revision and README
    product link 5426. The guide and official Adafruit CAD parts listing provide no
    separate 5700 file or revision-specific cross-reference. The shared guide link does
    not resolve whether the 5700 PCB uses identical outline/drills or a revised carrier.'
conflicts:
- Catalogue record does not resolve whether it represents product 5426 or product
  5700. The official shared guide links the general QT Py ESP32-S3 CAD repository while
  covering both SKUs, but its pinned board revision is explicitly mapped by the
  repository README only to product 5426. The manufacturer has not explicitly confirmed
  that product 5700 uses this same carrier revision and complete outline/drill pattern.
  Keep needs_review until catalogue SKU scope is resolved or product-5700 revision-level
  mechanical applicability is established.
notes:
- Evidence files were acquired 2026-11-06 UTC using requests with a 30-second timeout;
  URLs and SHA-256 hashes are recorded in sources.
- 'For the product-5426 CAD only, EAGLE layer-20 outline is 17.78 x 20.701 mm. Native
  outline centre is (-1.9685, 9.5885) mm. Transform used: x_top = x_native - (-1.9685);
  y_top = y_native - 9.5885; quarter-turn 0; x right, y up, USB at positive y. The
  preview is the bounding rectangle and empty selected-mount pattern.'
- All 34 drill/pad candidates were reviewed. X6:hole:1/2 are unplated USB-C connector
  anchoring holes; X6 M1-M4 are plated connector shell anchors; JP1/JP3 pads belong
  to 1X07_CASTEL castellated signal headers. None is a board mounting hole. This finding
  applies only to the product-5426 CAD revision.
- No hardware fit was tested. Component, connector, screw-head and underside clearance
  remain unverified.
