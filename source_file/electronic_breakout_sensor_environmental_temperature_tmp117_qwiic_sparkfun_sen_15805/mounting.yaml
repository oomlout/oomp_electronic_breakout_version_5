derivation: The manufacturer-linked dimension drawing states 1.00 in x 1.00 in PCB outline and shows four mounting-hole
  centres 0.10 in from the adjacent edges (0.90 in from the opposite edges). Convert 1.00 in * 25.4 = 25.4 mm; half-width/height
  = 12.7 mm. Centre positions are X,Y = (0.10 or 0.90) in * 25.4, giving canonical x = X - 12.7 and y = Y - 12.7,
  hence each coordinate is +/-10.16 mm. Top-view orientation follows the drawing (header edge at bottom) and native
  EAGLE +Y points up; no rotation or reflection is required. Hole diameters are not dimensioned on the drawing;
  they are taken from the pinned native CAD, where JP2, JP3, JP8 and JP9 each place a 3.302 mm non-plated hole in
  the named STAND-OFF package. The helper inspector cannot parse this CAD because it rejects two unrelated layer-20
  text labels; geometry is therefore recorded from the linked dimension drawing and corroborated against the complete
  raw board XML.
