derivation: 'Complete EAGLE layer-20 outline bounds are native x=[0,30.48] mm and
  y=[0,25.4] mm, so board_size native=[30.48,25.4] mm and native bounding-box centre=(15.24,12.7)
  mm. A CCW quarter-turn (quarter_turn=1) maps the native landscape bounds to canonical
  product orientation 25.4 x 30.48 mm, matching the manufacturer nominal 25.4 x 30.5
  mm. For every feature, first centre native coordinates: xc=x_native-15.24, yc=y_native-12.7;
  then apply x_mm=-yc, y_mm=xc. Full drill review found 26 candidates: JP3, JP4, JP11
  and JP13 are non-plated 3.302 mm drills in the explicitly described STAND-OFF mechanical
  footprint and are selected. The remaining 22 candidates are J3 four-pin header pads,
  J5/J10 single-pin header pads, J7 six ISP test-point header pads, and SW1 rotary
  encoder electrical/switch pads (including its two plated mechanical anchor pads
  M1/M2); these are not board mounting holes.'
