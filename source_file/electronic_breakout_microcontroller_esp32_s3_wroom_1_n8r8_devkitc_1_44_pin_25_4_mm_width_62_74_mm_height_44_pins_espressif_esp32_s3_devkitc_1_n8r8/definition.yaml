notes:
- Physical header contacts include supply, ground and reserved contacts; contact count is not GPIO count.
- N8R8 octal PSRAM occupies GPIO35/36/37; these header positions are not usable GPIOs on this variant.
- Revision 1.0 uses GPIO48 for RGB LED; captured geometry and guide are revision 1.1.
