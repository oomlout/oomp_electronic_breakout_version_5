derivation: The complete manufacturer top-view dimension drawing labels the PCB outline
  25.40 mm wide and 62.74 mm high. The 62.74 mm arrow spans the carrier PCB top and
  bottom edges; the antenna module and both USB connectors extend beyond these board
  edges and are excluded. The drawing top view has x increasing right and y increasing
  toward the antenna end (USB connectors at the opposite end). Translate drawing coordinates
  to the required centred PCB frame with x_mm = X_drawing - 25.40/2 = X_drawing -
  12.70 mm and y_mm = Y_drawing - 62.74/2 = Y_drawing - 31.37 mm; no rotation, reflection
  or axis swap. Reviewed the complete dimension sheet and every page of the official
  Rev 1.1 PCB layout. Candidate drilled features are the two 22-contact side-header
  rows J1/J3 (the official guide identifies these as pin headers), module contact/via
  features, and J2/J4 USB connector contact and retention features. They are electrical
  contacts, vias or connector anchors, not PCB mounting holes. The complete layout
  shows no discrete board mounting bores or mounting pattern; the mounting hole list
  is therefore explicitly empty.
