derivation: 'Use the manufacturer dimension drawing directly: 25.400 mm wide x 48.260 mm high (Unit:mm), PCB outline excluding module antenna overhang and connector protrusion. The drawing is a top view with USB connectors at the bottom. Canonical coordinates are centred on the PCB bounding box: x = X_drawing - 12.700 mm; y = 24.130 mm - Y_drawing, so +x points right and +y points up/away from USB. Reviewed the complete five-page Rev 1.0 PCB Layout drawing across copper, silkscreen/assembly and composite sheets. Candidate drills are J1/J3 electrical header holes, J5 current-measurement header pads, and the USB/UART connector retention anchors identified by their locations and silkscreen; none is a PCB mounting hole. The carrier drawings show no dedicated board-mount pattern, so mounting_holes is explicitly empty.'
