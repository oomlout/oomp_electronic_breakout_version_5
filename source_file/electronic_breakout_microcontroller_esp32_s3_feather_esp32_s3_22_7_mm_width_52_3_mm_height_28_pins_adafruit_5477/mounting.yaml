derivation: 'The exact EAGLE XML Layer-20 outline has native bounds X=0..50.80 mm and Y=0..22.86 mm, with
  the documented 90 degree corner arcs, so the PCB outline is 50.80 x 22.86 mm. Its native bounding-box
  centre is (25.40, 11.43) mm. The USB-C connector X3 is at native -X; apply quarter_turn=3 (270 degrees
  CCW), mapping centred coordinates (x,y) to (y,-x), so USB points +Y and board_size is [22.86, 50.80]
  mm. Selected all four board-mount features: plain:1 and plain:2 are 2.2 mm plain drilled holes at the
  end opposite USB; U$31/U$32 are explicitly named MOUNTINGHOLE_2.5_PLATED package pads with 2.5 mm plated
  drills at the USB end. Excluded the 1.0 mm JP1/JP3 header contact drills and X3 USB-C package mechanical
  drills/anchors (0.65 mm holes and 0.60 mm pads). The preview shows four holes at their asymmetric extracted
  positions with top view and USB toward +Y.'
