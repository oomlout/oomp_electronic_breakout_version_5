conflicts:
- topic: chip identity wording in guide overview
  claims:
  - claim: Guide introduction calls the sensor BME680.
    source_id: hookup_guide
  - claim: Product SKU/title and later guide-specific table identify BME688 and its 0x76 default address.
    source_id: product_page
  resolution: Later BME688-specific guide statements plus exact product SKU identify the selected product as BME688; opening guide copy appears legacy carry-over. This resolves product variant only, not physical installed marking.
  status: scoped_resolution
data_gaps:
- The archived official board-dimensions drawing has not been transcribed for exact outline, thickness, or mounting-hole coordinates; product separately claims a 1 inch x 1 inch breakout.
- Physical header contacts, complete labels, net mapping, and connector pin counts remain unresolved pending drawing/CAD inspection.
- Exact carrier I2C maximum clock and pullup resistor values are not stated in the reviewed listing/guide pages.
- Product SKU and datasheet identify BME688 variant; fitted device marking is not independently visible.
