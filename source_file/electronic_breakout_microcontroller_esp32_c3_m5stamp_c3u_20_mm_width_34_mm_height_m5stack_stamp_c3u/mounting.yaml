  wide x 34.00 mm high. The only feature called out Ã˜2.10 is the central PCB mounting
  hole; its centreline is at the horizontal board centre, so X=0.00 mm. The drawing
  dimensions its centre 19.00 mm from the bottom edge: drawing-origin Y = 19.00 mm;
  centre the board at height/2 = 17.00 mm, giving drawing-centred Y=19.00-17.00=+2.00
  mm. The drawing places the USB connector at the bottom edge; rotate the drawing
  180 degrees to the canonical top view with USB at +Y, applying (x,y)->(-x,-y), which
  yields canonical hole X=0.00 mm, Y=-2.00 mm. Review of the complete manufacturer
  dimension sheet top, side and bottom views shows only this one PCB mounting hole;
  edge contacts/pads and bottom-view artwork are not mounting holes. No PCB-layout
  CAD is published in the exact product directory at the pinned repository commit,
  so the drawing is the mechanical authority.'
