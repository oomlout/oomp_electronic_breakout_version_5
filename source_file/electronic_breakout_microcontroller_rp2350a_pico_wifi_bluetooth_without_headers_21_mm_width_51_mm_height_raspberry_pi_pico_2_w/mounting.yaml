derivation: 'Raspberry Pi RP-008304-DS-3 Figure 3 explicitly identifies a 21 x 51
  x 1 mm PCB and four drilled mounting holes, diameter 2.1 mm (+/-0.05 mm). The drawing
  dimensions the hole-column spacing as 11.4 mm and each end-hole centre 2 mm in from
  its short PCB edge. In the dimensioned top assembly view, the left/right hole columns
  are centred about the PCB width centreline: x = +/-11.4/2 = +/-5.7 mm. With the
  USB edge at the top, y = +(51/2 - 2) = +23.5 mm at the USB end and y = -(51/2 -
  2) = -23.5 mm at the antenna end. Frame transform: retain top view; drawing X right
  is canonical +X right; drawing vertical orientation has USB at top, canonical +Y
  toward USB; no mirror or quarter-turn. Hole plating is unspecified and recorded
  null.'
