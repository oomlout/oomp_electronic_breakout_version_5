derivation: EAGLE layer 20 Dimension lines give native bounds x=0..30.48 mm and y=0..25.4
  mm, centre (15.24,12.7) mm. Centring subtracts this centre. Explicit CCW quarter-turn
  1 maps centred native coordinates (x,y) to (-y,x), swapping extents to 25.4 x 30.48
  mm. Thus JP3 at native (2.54,22.86) maps from (-12.70,10.16) to (-10.16,-12.70)
  mm; JP4 at (27.94,22.86) maps from (12.70,10.16) to (-10.16,12.70) mm. The guide
  states 25.4 x 30.48 mm and two holes on one side, consistent with this orientation.
