derivation: 'Raspberry Pi Pico Datasheet, PDF p.7 printed p.6, Figure 3, is a dimensioned
  top view captioned for the Raspberry Pi Pico Rev3 board. It labels the PCB outline
  21 mm × 51 mm, four Ø2.1 mm drilled mounting holes, horizontal hole-centre spacing
  11.4 mm (thus x = ±11.4/2 = ±5.7 mm about the board centre), and vertical row-centre
  spacing 48.26 mm. Both horizontal rows share the same x locations. USB overhang
  is outside the PCB outline. Axis transform: drawing origin at the PCB top-left corner
  with U positive right and V positive down; canonical top-view centred coordinates
  use x = U − 21/2 and y = 51/2 − V. The symmetric rows are each (51 − 48.26)/2 =
  1.37 mm from the ends. For the USB/top row, V=1.37 mm, giving y=25.5−1.37=+24.13
  mm; the bottom row V=49.63 mm, giving y=25.5−49.63=−24.13 mm. The left/right hole
  x values are U=4.8 and 16.2 mm, so x=4.8−10.5=−5.7 mm and x=16.2−10.5=+5.7 mm. All
  measurements are direct drawing dimensions or arithmetic from them; no scale measurement
  was used.'
