notes:
- The seed mounting_context.json carried y=±23.5 mm for hole centres; this does not
  match the official Figure 3 dimension of 48.26 mm between rows. The dimensioned
  source yields y=±24.13 mm, used here. The discrepancy is resolved in favour of the
  directly dimensioned official figure.
- The standard holder is generated geometry only. Component, presoldered header, connector,
  screw-head, and underside clearance remain unverified; no physical fit test was
  performed.
- Helper policy requires at least a 2.2 mm PCB drill for M2 (2.0 mm nominal screw
  plus 0.2 mm diametral clearance); the official Pico datasheet specifies four
  Ø2.1 mm (±0.05 mm) drills, whose maximum specified diameter is 2.15 mm. Do not
  enlarge holes or select a different screw by guess. Custom holder
  or an explicit project screw policy is required before the standard-holder workflow
  can proceed. No helper preview, promotion, or generation was completed.
