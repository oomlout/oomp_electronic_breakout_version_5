derivation: The official ESP32-DevKitC V4 dimension drawing states the bare carrier
  PCB outline is 27.94 mm wide × 48.26 mm high. Dimensions are recorded as width,
  height in mm. The drawing is top view with the RF antenna/module end at the top
  and Micro-USB connector at the bottom; canonical x points right and y points up,
  so the drawing maps directly to the centred top-view frame with origin at (13.97,
  24.13) mm from its lower-left PCB bound, with no axis swap, rotation, or reflection.
  Reviewed the complete manufacturer dimension sheet and all six pages of the manufacturer
  V4 PCB layout, including the drill depiction. The 38 large through holes are the
  two 19-pin I/O header rows, the four oblong USB receptacle shell anchors are connector
  retention features, the adjacent small drills are USB connector contacts, and the
  other small plated drills are circuit vias/components. None is a board mounting
  hole; the complete carrier drawing and layout show no designated board mounting
  pattern.
