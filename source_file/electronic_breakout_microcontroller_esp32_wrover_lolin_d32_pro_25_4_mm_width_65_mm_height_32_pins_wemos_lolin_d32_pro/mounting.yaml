derivation: The complete official Dimension V2.0.0 page is a top-view drawing. It
  labels the board 25.40 mm wide by 65.00 mm long, shows two circular candidate holes
  at one end, gives 21.40 mm between their centres, and gives a 2.10 mm dimension
  from the short edge to the near hole centre. It does not label the hole drill diameter.
  Drawing view orientation relative to the product USB connector also is not labeled
  on this page. Do not infer the PCB drill from circle pixels or assign canonical
  coordinates until the drill and orientation are supported.
