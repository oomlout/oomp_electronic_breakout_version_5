derivation: 'EAGLE layer-20 bounds; explicit package/plain drills; centred then rotated clockwise 90 degrees to place USB at positive Y. Native EAGLE bounds are 50.8 x 22.86 mm with centre (25.4, 11.43). For each native point (X,Y), first centre it, then apply quarter-turn 3: x = Y - 11.43 and y = -(X - 25.4). The resulting canonical outline is 22.86 x 50.8 mm. Explicitly selected only the two plain board holes and two pads in MOUNTINGHOLE_2.5_PLATED packages; all header pads, USB connector holes and tabs, and other drilled candidates were reviewed and excluded.'
