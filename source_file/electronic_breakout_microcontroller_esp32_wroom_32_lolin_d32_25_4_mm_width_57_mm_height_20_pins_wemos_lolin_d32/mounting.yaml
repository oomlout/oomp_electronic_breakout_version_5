derivation: The complete official Dimension V1.0.0 PDF depicts the 25.40 x 57.00 mm
  PCB outline and two circular drills at its same short end. Its explicit centre-to-centre
  dimension is 21.40 mm; centering that dimension on the 25.40 mm outline gives x
  = ±21.40/2 = ±10.70 mm. The drill callout is 2.10 mm. The vector drawing also places
  each centre 16.98 PDF points from the corresponding bounding edge. Using the drawing
  scale 215.88 points / 25.40 mm = 8.4992 points/mm gives an edge offset 16.98 / 8.4992
  = 1.998 mm, nominally 2.00 mm. With the PCB bounding-box centre as origin and the
  hole row at the upper end of the drawing, y = 57.00/2 - 2.00 = +26.50 mm for both
  drills. The drawing is a top view with its long axis vertical and short axis horizontal,
  so it maps directly to canonical +x right, +y up; no axis swap, rotation or reflection
  is applied. The complete sheet shows exactly these two circular board drills; no
  connector retention features or header pads are represented as additional mounts.
