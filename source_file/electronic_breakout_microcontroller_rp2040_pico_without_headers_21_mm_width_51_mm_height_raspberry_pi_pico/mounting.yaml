derivation: 'Datasheet page 6, Figure 3: PCB bounding box is 21 x 51 mm. Top view
  is oriented with the micro-USB connector at positive Y; the outline centre is (0,0),
  X positive right and Y positive toward the connector. The drawing gives mounting-hole
  columns at X = +/-5.7 mm (also 4.8 mm in from the left edge: -10.5 + 4.8 = -5.7;
  opposite column is +5.7). Upper row is 2.0 mm below the top edge: Y = 51/2 - 2.0
  = +23.5 mm. Lower row is 2.4 mm above the bottom edge: Y = -51/2 + 2.4 = -23.1 mm.
  Figure 3 states four drilled mounting holes Ø2.1 mm. The 48.26 mm dimension is the
  span of the long-edge header rows, not a mounting-hole-row spacing. The Ø1 mm pin
  holes and SWD castellated pads are electrical interfaces and are excluded; the four
  explicitly dimensioned Ø2.1 mm holes are identified as mechanical fixing holes.'
