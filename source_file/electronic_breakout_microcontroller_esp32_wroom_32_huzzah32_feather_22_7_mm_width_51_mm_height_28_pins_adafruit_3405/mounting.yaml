  IDs are plain:1, plain:2, U$31:pad:P$1 and U$32:pad:P$1. Candidate transformed coordinates
  would be (-9.5885,-22.86), (9.525,-22.86), (-8.89,22.86), and (8.89,22.86) mm under
  q3, respectively. These remain unaccepted because the mandated helper refuses the
  source; do not promote from this note.
- New manufacturer webpage, repository README and fab-print evidence files were acquired
