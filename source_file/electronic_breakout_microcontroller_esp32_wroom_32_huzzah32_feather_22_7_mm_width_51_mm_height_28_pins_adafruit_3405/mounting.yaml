attempts:
- source: Manufacturer PCB repository, pinned CAD at e23514c6f9e124a60f9d1de6567c791561b43e73
  result: Exact CAD identity and Rev C verified; archived file SHA-256 equals pinned
    raw CAD bytes. mounting_research.py inspect-eagle --all-drills and eagle with
    explicit four candidates both stop with “Footprint contains layer-20 geometry;
    verify board outline manually”. No helper extraction result is available, so no
    promotion.
- source: Official Adafruit fabrication print in the HUZZAH32 guide, downloaded 2026-11-06
  result: Viewed complete drawing. It shows four hole features and inch dimensions,
    but callouts do not unambiguously give the drill sizes and all four center coordinates
    needed for a defensible drawing-based record.
- source: Official Adafruit product page 3405 and product guide downloads page
  result: Confirms product identity and that the EagleCAD repository is the guide-linked
    board source; no separate fully dimensioned mechanical drawing found in these
    pages.
- source: Current official manufacturer repository HEAD checked 2026-11-07
  result: The current master HEAD is still e23514c6f9e124a60f9d1de6567c791561b43e73;
    its raw board file is 774658 bytes with SHA-256
    992bffd6f20cd5fb8087a5008e6154a038db17f7a3e3fe9dad4bcff48adc0200, exactly
    matching the archived, pinned Rev C CAD. There is no newer official CAD revision
    to resolve the parser blocker. Re-running inspect-eagle --all-drills still stops
    with "Footprint contains layer-20 geometry; verify board outline manually".
    The available Adafruit fab print remains insufficient for a drawing-only record;
    although it gives board and feature locations, it does not unambiguously dimension
    the drill diameters of all four candidates. The precise gap is that no supported
    extraction or fully dimensioned mechanical source establishes the four hole
    diameters and locations; no geometry was promoted from manual candidates.
