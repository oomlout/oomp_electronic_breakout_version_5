  - avenue: Exact D1 R32/ESPDuino-32 mechanical-source search
    date: '2026-11-06'
    details: >-
      Searched for exact D1 R32 and ESPDuino-32 manufacturer CAD and dimensioned
      drawings. Results were third-party schematics, unofficial models, listing
      pages, and generic manuals; none establishes this entry's carrier identity
      and an exact mechanical revision. A forum result notes a purported D1 R32
      Fritzing part has mounting-hole marks only in silkscreen, which cannot confirm
      drilled holes. Exact carrier identity and complete mechanical evidence remain
      unavailable.
  - avenue: Catalogue outline dimensions
    date: '2026-11-06'
    details: >-
      The 53.34 x 68.58 mm dimensions are nominal catalogue values only, explicitly
      marked unverified in mounting_context.json. They cannot establish exact board
      outline or hole geometry and were not used for a holder.
  - avenue: Recheck of WEMOS product documentation and exact-board CAD links
    date: '2026-11-07'
    details: >-
      Rechecked the official WEMOS documentation at https://www.wemos.cc/en/latest/
      and its linked D32 index at https://www.wemos.cc/en/latest/d32/index.html.
      The current board index lists D32 and D32 Pro, and neither page identifies a
      D1 R32 carrier or exposes an exact D1 R32 mechanical file. The RIOT-OS
      Wemos D1 R32/ESPDuino-32 documentation links a third-party mirrored ETT
      schematic (https://gitlab.com/gschorcht/RIOT.wiki-Images/raw/master/esp32/Wemos-D1-R32_Schematic.pdf);
      its title block identifies an ETT schematic, but it is not a PCB layout,
      dimensioned mechanical drawing, or revision-controlled CAD. This does not
      establish that the generic catalogue record is that board.
  - avenue: D1 R32 dimensioned-drawing candidate and identity check
    date: '2026-11-07'
    details: >-
      Reviewed the ADIY D1 R32 datasheet at
      https://rajguruelectronics.com/Product/33071/250925180036.pdf. It describes
      an ADIY-branded D1 R32 product with a USB-C connector and ESP-WROVER-32
      module (with pads that can accept WROOM), states PCB size 68.5 x 53.34 mm,
      and includes a dimensioned footprint drawing with mounting/edge marks. It is
      a product-specific drawing, but this catalogue item is explicitly generic,
      is based on ESP32-WROOM-32 software aliases, and carries no ADIY, USB-C,
      WROVER, or carrier-revision identity. Matching nominal outline dimensions
      alone cannot link this drawing to the catalogue carrier. The drawing was
      therefore not used to infer this board's mounting geometry. Exact carrier
      identity and a revision-controlled mechanical source for it remain unknown.
