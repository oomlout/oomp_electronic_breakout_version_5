  mm (25.4 x 17.78 mm bounding box, including rounded corners). Native bounding-box
  centre is (12.7, 8.89) mm. Quarter-turn is 0; transform to canonical centred top
  view is x_mm=x_native-12.7, y_mm=y_native-8.89, preserving +x right and +y up. Full
  drill inspection contains nine candidates. Four U$1/U$17/U$19/U$21 pad:P$1 drills
  are 2.5 mm plated pads in MOUNTINGHOLE_2.5_PLATED packages and are selected as board
  mounts. Remaining five candidates JP2:pad:1..5 are 1.0 mm plated 1X05_ROUND_70 header
  contacts at the board edge; excluded as electrical header holes. Official fab drawing
  page 26 confirms the four corner P$1 mounting holes and SHT45 carrier identity.
  Reviewed top-view preview against CAD; all coordinates and diameters match.
