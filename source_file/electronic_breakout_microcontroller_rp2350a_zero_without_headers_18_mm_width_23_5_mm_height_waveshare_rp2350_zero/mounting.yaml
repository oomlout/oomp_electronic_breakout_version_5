derivation: 'Board size is directly labelled 18.00 x 23.50 mm on the manufacturer
  dimensioned top view. Reviewed the complete PCB solid (STEP solid 0): native bounds
  x=-0.009..18.009 mm, y=-0.014..23.509 mm, thickness z=-0.798..0.000 mm. The outline
  is 18 x 23.5 mm within STEP tolerance. Axis transform to the canonical centred top
  view is x_mm=x_native-9.000 and y_mm=y_native-11.750; +Y points toward the USB connector.
  Inspected all 25 cylindrical faces on the board solid: 23 radius-0.450 mm (Ø0.900
  mm) features are the castellated electrical contact pads shown along both long edges
  and bottom edge of the drawing; two radius-0.350 mm (Ø0.700 mm) features at native
  x≈6.100 and 11.880, y≈18.272 mm belong to the USB connector anchors. None are board
  mounting holes. Complete board evidence contains no discrete board-mount holes,
  so the hole pattern is explicitly empty.'
