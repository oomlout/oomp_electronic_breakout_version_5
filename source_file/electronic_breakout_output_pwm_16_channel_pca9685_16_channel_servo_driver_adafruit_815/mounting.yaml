derivation: 'Complete EAGLE layer-20 outline in Adafruit PCA9685 rev C.brd has native bounds x=[-1.905,60.325]
  mm and y=[-6.477,18.923] mm, including the four 3.175 mm corner arcs. Thus board_size=[62.23,25.40]
  mm and native bounding-box centre=(29.210,6.223) mm. Canonical top-view transform is x_mm=x_native-29.210
  and y_mm=y_native-6.223; no mirror or quarter-turn is applied (quarter_turn=0), so native +x is right
  and +y is up. The full drill review reports 68 candidates: U$47 through U$50 each belong to the explicit
  MOUNTINGHOLE_2.5_PLATED package/value MOUNTINGHOLE2.5 and have 2.5 mm PCB drills; these four are the
  mounting holes. The other 64 drills are pads in terminal-block, capacitor, jumper/address-select, and
  servo-output header packages and are excluded. The official guide independently states the mounting
  holes are 2.5 mm diameter. The pinned alternate EAGLE 9.6.2 file in the same repository was checked:
  its outline origin differs, but its centred board dimensions and four mounting-hole coordinates match
  rev C. The product page lists 62.5 x 25.4 mm nominal dimensions; exact layer-20 CAD bounds (62.23 x
  25.40 mm) are used for generated geometry.'
