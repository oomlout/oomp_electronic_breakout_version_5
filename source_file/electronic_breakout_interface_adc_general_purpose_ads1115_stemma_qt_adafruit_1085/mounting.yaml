derivation: >-
  Complete EAGLE layer-20 outline has native bounds x=[0,25.4] mm and y=[0,17.78]
  mm, including four 2.54 mm corner arcs. Thus board_size=[25.4,17.78] mm and
  native bounding-box centre=(12.7,8.89) mm. Transform native EAGLE coordinates
  to the canonical top view by x_mm=x_native-12.7 and y_mm=y_native-8.89; no
  quarter-turn or mirror is applied (quarter_turn=0). The full drill review found
  16 candidates: JP1/JP2 are 1.0 mm 1x06 header pads and are excluded; the four
  2.5 mm drills belong to U$25/U$27/U$29/U$30, each package explicitly named
  MOUNTINGHOLE_2.5_PLATED with value MOUNTINGHOLE2.5, and are the four board
  mounting holes. Two fiducials are separate board features and have no drills.
