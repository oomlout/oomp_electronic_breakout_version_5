identity_evidence: Espressif's official ESP32-C3-DevKitM-1 guide links the PCB layout, dimension PDF, and dimension DXF; the PCB layout title block identifies ESP32-C3-DevKitM-1 Rev 1.0. The guide lists this carrier as ESP32-C3-MINI-1 based and says there are no previous versions available. The full-page manufacturer dimension drawing and six-page board layout agree on the 25.40 x 38.91 mm carrier and USB connector at the drawing's lower end.
