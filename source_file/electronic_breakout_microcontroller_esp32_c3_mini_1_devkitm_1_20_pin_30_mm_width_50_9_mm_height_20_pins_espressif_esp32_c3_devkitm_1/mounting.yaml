derivation: 'The official complete top-view dimension drawing labels the PCB outline 25.40 mm wide and 38.91 mm high. Source drawing orientation is retained: x increases to the right and y increases upward, with origin translated from the drawing’s lower-left PCB bound to its centre (12.70 mm, 19.455 mm); no rotation, reflection or axis swap. Thus the antenna/module end is +Y and the Micro-USB connector is -Y. The seeded catalogue context labels USB at +Y, but that feature-direction note conflicts with the top-view manufacturer drawing; the mechanical record follows the drawing orientation. This resolved direction discrepancy does not affect the empty mounting pattern or board dimensions. Reviewed every page and layer of the official six-page Rev 1.0 PCB layout together with the full dimension sheet. The 30 plated through-hole pads are the two 15-contact header rows; drilled/metallic features at the USB edge are connector contacts and retention anchors; small circular drills in the module area belong to the module land/via pattern. None is a board mounting hole. The complete dimension drawing and full layout show no designated board mounting holes.'
