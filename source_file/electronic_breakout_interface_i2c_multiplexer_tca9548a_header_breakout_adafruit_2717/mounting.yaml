notes:
- Inspected all drilled candidates in the exact Eagle CAD. U$4 and U$5 are the only
  explicit mounting-feature packages; both are plated holes, 2.5 mm drill, 3.2 mm
  annular pad, matching the two mounting sites shown in the fabrication drawing. JP1
  and JP3 contain 1.0 mm electrical header drills and are excluded. Fiducials have
  no drills. The selected hole diameter is the PCB drill, not screw size.
- The guide fabrication print labels the nominal drill as 0.1 inch (2.54 mm); exact
  CAD package drill is 2.5 mm. The small difference is drawing rounding; use the CAD
  drill value.
