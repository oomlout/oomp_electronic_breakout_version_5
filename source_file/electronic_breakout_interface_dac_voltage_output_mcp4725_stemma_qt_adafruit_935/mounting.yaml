derivation: 'Complete EAGLE layer-20 outline has native bounds x=[0,25.4] mm and y=[0,17.78] mm; curved
  corner segments terminate at the bounding extents. Therefore board_size=[25.4,17.78] mm and native bounding-box
  centre=(12.7,8.89) mm. Transform EAGLE native coordinates to canonical top view with x_mm=x_native-12.7
  and y_mm=y_native-8.89; no mirror or quarter turn is applied (quarter_turn=0). Full drill review lists
  12 candidates: six JP1 pads are 1.0 mm 1x06 header drills; two X1 pads are 1.0 mm terminal-block connection
  drills; these eight are excluded. The remaining four drills are the pads of U$20/U$21/U$25/U$27, all
  explicitly in package MOUNTINGHOLE_2.5_PLATED (value MOUNTINGHOLE2.5), each with 2.5 mm PCB drill and
  3.2 mm annular diameter; these are the board mounting holes.'
