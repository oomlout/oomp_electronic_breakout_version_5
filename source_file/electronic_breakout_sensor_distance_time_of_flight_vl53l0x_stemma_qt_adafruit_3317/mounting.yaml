derivation: 'Exact manufacturer EAGLE board file Adafruit VL530X STEMMA QT.brd at pinned commit 1ef873512150740edc9798f90028facfa35fd81f.
  Layer-20 dimension outline bounds are x=0..25.4 mm and y=0..17.78 mm, so the native centre is (12.7,
  8.89) mm. For top view with quarter_turn=0, transform each native drill (X,Y) to centred coordinates
  (x,y)=(X-12.7,Y-8.89), with no reflection or rotation. Selected all four named MOUNTINGHOLE_2.5_PLATED
  pads U$30, U$31, U$33 and U$34; each PCB drill is 2.5 mm. The complete drilled-feature inventory has
  10 candidates: the other six, JP2 pads 1 through 6 in package 1X06_ROUND_70, are the soldered header
  and are not board mounting holes. The Adafruit product revision history also independently specifies
  four mounting holes. Preview checked against the extraction: centred rectangular extent and all four
  corner locations, diameters and count agree. Product page separately lists 21.0 x 18.0 mm under Product
  Dimensions, which conflicts with its more specific July 2020 0.7 x 1.0 inch carrier revision and the
  exact QT CAD outline; use the exact carrier CAD bounds for the PCB outline.'
