derivation: 'The exact EAGLE XML board uses mm. Parsed the complete layer-20 outline:
  native bounds give 17.780 x 20.701 mm; native bounding-box centre is (8.890, 10.3505)
  mm. Retain quarter-turn 0: centred top-view coordinates are x = X_native - 8.890,
  y = Y_native - 10.3505, with +x right and +y toward the USB edge. Inspected all
  34 drilled candidates with package and feature identity. X6:hole:1/2 (0.65 mm) and
  X6:pad:M1-M4 (0.60 mm plated) are USB-C receptacle mechanical anchors; JP1/JP3 pad
  1-7 and 1C-7C (1.00 mm plated) are castellated electrical contacts. None are PCB
  mounting holes. No other drilled candidates exist in the complete board file, so
  the mounting pattern is empty.'
