identity_evidence: Adafruit Product 1231 identifies the ADXL345 STEMMA QT/Qwiic product and states that the March 23, 2022 QT update changed the physical shape and pinout; it also states four 2.5 mm mounting holes. The manufacturer hardware repository contains the exact matching filename ADXL345 STEMMA QT.brd. Its commit-pinned raw file was independently fetched and byte-compared with the archived CAD (269137 bytes; SHA-256 1dda7529faac26f3a075fa7c4ec9e705adc9aa0ae46119f785a8f67781a3fe7e). The older repository README describes the legacy two-hole board, so it does not apply to this named QT revision. CAD labels U1 ADXL343 whereas the catalogue product is ADXL345; this pre-existing chip-identity conflict is outside mounting geometry and does not change the explicit carrier outline or mounting pads. Actual fitted IC remains unverified.
