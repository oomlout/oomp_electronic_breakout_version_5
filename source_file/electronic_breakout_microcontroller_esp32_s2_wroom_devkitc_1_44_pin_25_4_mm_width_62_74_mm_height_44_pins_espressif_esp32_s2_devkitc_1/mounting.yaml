identity_evidence: The official ESP32-S2-DevKitC-1 guide identifies the carrier and says this is its first board revision; it links the ESP32-S2-DevKitC-1 dimensions and PCB layout. The archived drawing DXF_ESP32-S2-DevKitC-1_V1_20210511.pdf independently labels ESP32-S2-DevKitC-1, Rev 1.0, and drawing #36065, with matching 25.40 × 62.74 mm board dimensions. The catalogue ID includes “WROOM”, while Espressif's guide describes SOLO/SOLO-U and SOLO-2/SOLO-2U module variants; that module naming is not resolved here and the carrier-level mounting result is scoped to the named DevKitC-1 Rev 1.0.
