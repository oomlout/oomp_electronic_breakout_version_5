derivation: >-
  Reviewed the complete manufacturer mechanical layout, page 1, including the full
  PCB boundary, both pin-header rows, both USB connectors and all component/pad
  features. The outline is dimensioned 25.40 mm × 62.74 mm. No intentional board
  mounting holes are drawn. The visible plated header positions are interface
  pads; USB connector tabs/anchors belong to J2/J4 and are not board mounts. No
  other candidate mounting drill is shown. Dimensions are already in mm; no unit
  conversion is applied. For a top-left drawing origin with X right and Y down,
  centred canonical coordinates are x = X - 25.40/2 and y = 62.74/2 - Y. Thus
  the drawing's USB connectors at the bottom map to negative y in the canonical
  positive-up frame. The pattern is empty, so no per-hole coordinates or diameter
  derivations apply.
