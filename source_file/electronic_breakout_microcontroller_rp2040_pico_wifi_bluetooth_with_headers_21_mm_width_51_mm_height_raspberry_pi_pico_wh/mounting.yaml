board_revision: Raspberry Pi Pico W/WH wireless carrier layout, represented by manufacturer
  design file rpi-picow-r3-2.brd from the official 2022-06-07 Pico W design archive.
  Raspberry Pi's official Pico-series documentation states Pico W and Pico WH share
  the same board layout; WH adds presoldered headers and the keyed central debug connector.
  Mounting geometry is taken from the matching official Pico W Figure 3 drawing.
