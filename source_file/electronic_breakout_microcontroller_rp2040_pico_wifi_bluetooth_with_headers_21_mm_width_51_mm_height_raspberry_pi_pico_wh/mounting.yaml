identity_evidence: Raspberry Pi's pinned official documentation identifies Pico W
  and Pico WH as first-generation wireless RP2040 boards and explicitly says they
  have the same board layout, with presoldered headers and debug connector style as
  the physical distinctions. It links to the official Pico W/WH design files and Pico
  W datasheet. The official archive contains rpi-picow-r3-2.brd; the binary CAD could
  not be replayed by the XML EAGLE extractor, so the matching dimensioned Figure 3
  in the official Pico W datasheet supplies the mounting dimensions.
