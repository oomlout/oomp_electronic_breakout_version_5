derivation: The manufacturer Figure 3 is a top assembly with the USB connector at
  the top. Its outline is 21 mm wide by 51 mm high. The drawing and accompanying text
  identify four Ø2.1 mm drilled mounting holes. The pair spacing across the width
  is 11.4 mm, so x = ±11.4/2 = ±5.7 mm from the centred outline. Each end pair has
  a 2 mm edge-to-centre offset along the 51 mm axis, so y = ±(51/2 - 2) = ±23.5 mm.
  The drawing USB-at-top direction maps to canonical positive Y (up); X increases
  right. All other visible drilled features are 1 mm header positions and are not
  mounting holes; only the four explicitly called out 2.1 mm mounting drills are selected.
