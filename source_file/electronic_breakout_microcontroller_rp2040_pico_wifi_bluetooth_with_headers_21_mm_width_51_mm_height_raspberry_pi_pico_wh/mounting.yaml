conflicts:
- The manufacturer specifies Ø2.1 mm PCB mounting drills. The standard holder generator
  requires at least 2.2 mm for its smallest supported M2 screw to maintain 0.2 mm
  diametral clearance. Preview rejects these holes as too small; custom holder/screw
  policy review is required before promotion.
