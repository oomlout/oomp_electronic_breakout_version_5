derivation: 'Reviewed Raspberry Pi Pico 2 datasheet Release 5, section 3, Figure 3
  (page 7), and the complete official rpi_pico2.step model. Figure 3 identifies a
  21 x 51 mm PCB and four ÃƒËœ2.1 mm drilled mounting holes. In the STEP model, the
  PCB outline solid is X=[-10.5,10.5], Y=[-25.5,25.5] mm, so its bounding-box centre
  is (0,0). The four radius 1.05 mm cylindrical drills are exactly at native XY coordinates
  (-5.7,-23.5), (-5.7,23.5), (5.7,-23.5), and (5.7,23.5) mm; other through-hole cylinders
  belong to the pin rows/connectors and are not mounting holes. The model X axis points
  right in top view and +Y points toward USB, matching the canonical frame without
  rotation or reflection: x_canonical=X_step-0; y_canonical=Y_step-0. Drill diameter=2*1.05=2.10
  mm. Board size comes from the drawing and STEP PCB outline; the STEP simplified
  body Z thickness (0.91 mm) differs from nominal datasheet thickness (1 mm), with
  no impact on XY mounting coordinates.'
