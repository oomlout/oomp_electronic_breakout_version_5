    and y=0..25.4 mm. Bounding-box centre is (8.89, 12.7) mm. Extracted pad coordinates
    are translated by subtracting that centre; quarter_turn=0, so canonical x=x_native-8.89,
    y=y_native-12.7. The four selected drills are explicitly placed in package MOUNTINGHOLE_2.5_PLATED,
    with IDs U$1, U$17, U$19 and U$21. The full drill inspection also showed 1.0 mm
    plated header pads on JP2/JP3; these are connector pads, not board mounts, and
    were excluded.
