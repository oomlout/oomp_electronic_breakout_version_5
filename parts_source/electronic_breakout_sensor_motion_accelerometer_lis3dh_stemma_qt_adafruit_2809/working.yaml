    2809 and states that its design uses the STEMMA QT form factor; the repository
    contains separate Adafruit LIS3DH.brd and Adafruit LIS3DH Original.brd files.
    This record uses the current Adafruit LIS3DH.brd, and its carrier file is the
    one inspected and extracted.
