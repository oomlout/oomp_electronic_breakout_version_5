  derivation: 'EAGLE layer-20 outer outline spans native x=0..25.4 mm and y=0..17.78
    mm. The bounding-box centre is (12.7, 8.89) mm. Quarter-turn is 0; canonical top-view
    transform is x_mm=x_native-12.7 and y_mm=y_native-8.89, preserving +x right and
    +y up. Full drill inspection found ten candidates: U$9:pad:P$1 and U$17:pad:P$1
    are 3.0 mm plated drills in explicitly named MOUNTINGHOLE_3.0_PLATEDTHIN packages
    and are the two board mounts. JP1:pad:1..8 are 1.0 mm plated 1X08_ROUND_70 electrical
    header contacts and are excluded. The exact CAD selection and top-view preview
    are reviewed against the raw board.'
