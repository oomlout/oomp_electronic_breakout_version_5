  derivation: EAGLE layer-20 board outline bounds are native x=0..25.4 and y=0..25.4
    mm, giving 25.4 x 25.4 mm. Native CAD origin is at the lower-left board corner
    (0,0); canonical top-view centre is (12.7,12.7) mm. Transform each hole by x_mm=x_native-12.7,
    y_mm=y_native-12.7, with quarter-turn 0 (no rotation, reflection or axis swap).
    The four STAND-OFF footprint drills are at native coordinates (2.54,22.86), (22.86,22.86),
    (22.86,2.54), (2.54,2.54) mm, yielding centred (-10.16,10.16), (10.16,10.16),
    (10.16,-10.16), (-10.16,-10.16) mm and 3.302 mm drill diameter each. The official
    drawing independently labels the board 1.00 x 1.00 in (25.4 x 25.4 mm), hole-centre
    spacing 0.80 in (20.32 mm), and 0.10 in (2.54 mm) from each edge to the hole centres.
    The complete CAD drill scan also found six J3 1x06 plated header pads (1.016 mm
    drills); these are electrical connector pads, not mounting holes, and were excluded.
    EAGLE board-level hole is outside the PCB outline at (0,0) and is not a carrier
    hole.
  fit_status: generic_holder_not_physical_fit_tested
  identity_evidence: The archived official SparkFun SEN-19096 product page links the
    Qwiic_Environmental_Sensor_BME688 hardware repository. Its README names SparkFun
    Environmental Sensor - BME688 (Qwiic), SEN-19096, lists SEN-19096 as the initial
    release, and identifies /Hardware as Eagle design files. The pinned Hardware/Qwiic_BME688.brd
    is the exact carrier CAD used here.
