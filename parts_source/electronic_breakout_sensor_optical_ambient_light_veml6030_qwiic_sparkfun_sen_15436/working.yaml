  board_revision: SparkFun Ambient Light Sensor VEML6030 (Qwiic), SEN-15436; board
    silk v10; manufacturer EAGLE design at commit 3bd26752ab454b0edc459a4ec24953aff38f9807
    (2019-08-19)
  board_size:
