  derivation: 'EAGLE board outline is four straight layer-20 wires from (0,0) to (25.4,25.4)
    mm, so bbox size is 25.4 x 25.4 mm and native bbox centre is (12.7,12.7) mm. Top
    view, no rotation: canonical x = native x - 12.7; canonical y = native y - 12.7
    (native +Y maps to top-view +Y). H1 native (22.86,22.86) -> (+10.16,+10.16); H2
    (2.54,22.86) -> (-10.16,+10.16); H3 (22.86,2.54) -> (+10.16,-10.16); H4 (2.54,2.54)
    -> (-10.16,-10.16). Package STAND-OFF-TIGHT defines 3.048 mm mechanical through-holes
    and keepout circles. Full drill inspection found nine candidates: H1-H4 and J3
    pads 1-5. J3 is the five-contact functional 1X05 header row (1.016 mm drills),
    not mounting hardware; these were excluded. EAGLE vias (0.381 mm) are below candidate
    threshold and not mounts.'
  fit_status: generic_holder_not_physical_fit_tested
  identity_evidence: SparkFun product page names SKU SEN-15436 and links its GitHub
    product repository; pinned repository README names the same SEN-15436 product
    and says Hardware contains Eagle design files. The selected Hardware/SparkFun_Ambient_Light_Sensor_VEML6030.brd
    is from that repository commit and its board silk reads v10.
