  derivation: 'Extracted the unmodified layer 20 outline from the pinned Eagle CAD
    (native mm). Outline extrema are x=0..35.56 and y=0..33.02, giving a 35.56 x 33.02
    mm bounding box centred at (17.78, 16.51) mm. No rotation or reflection: top-view
    x_mm = native_x_mm - 17.78; y_mm = native_y_mm - 16.51; quarter_turn=0. Full drill
    review found 14 candidates. U$1/U$17/U$19/U$21 are each package MOUNTINGHOLE_2.5_PLATED
    with 2.5 mm PCB drills; these are the only board mounting features. U1 has two
    0.4 mm OLED module retention holes and JP2 has eight 1.0 mm electrical header
    drills; all are excluded. The four selected holes centre at native (2.54,30.48),
    (33.02,30.48), (2.54,2.54), (33.02,2.54) mm. The spacing is 30.48 x 27.94 mm,
    matching the product page rounded 30.5 x 28 mm.'
  fit_status: generic_holder_not_physical_fit_tested
  identity_evidence: Adafruit product 938 revision history identifies the Nov 20 2019
    QT redesign and says the board dimensions and mounting layout changed then; the
