  board_revision: Adafruit product 938 1.3-inch 128x64 OLED STEMMA QT carrier, Nov
    20 2019 QT redesign; the exact QT Eagle board is pinned at repository commit 02c953af3a9c7c53d0c33faaa98a8aa1bffca5be.
    The product page reports a Feb 9 2024 silkscreen refresh; no board geometry change
    is stated there.
