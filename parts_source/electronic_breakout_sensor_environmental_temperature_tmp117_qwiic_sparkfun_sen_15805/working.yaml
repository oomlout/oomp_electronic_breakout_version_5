mounting_research:
  board_revision: SparkFun High Precision Temperature Sensor TMP117 (Qwiic), SEN-15805;
    design file Sparkfun_TMP117_Qwiic.brd at SparkFun repository commit aa763eaee71d9245e5c31daa6883f6f5c6186f16
    (2019-11-15). Product-linked board dimensions drawing matches 1.00 x 1.00 in carrier.
  board_size:
  - 25.4
  - 25.4
  coordinate_system:
    origin: pcb_bounding_box_centre
    units: mm
    view: top
    x_positive: right
    y_positive: up
  derivation: The manufacturer-linked dimension drawing states 1.00 in x 1.00 in PCB
    outline and shows four mounting-hole centres 0.10 in from the adjacent edges (0.90
    in from the opposite edges). Convert 1.00 in * 25.4 = 25.4 mm; half-width/height
    = 12.7 mm. Centre positions are X,Y = (0.10 or 0.90) in * 25.4, giving canonical
    x = X - 12.7 and y = Y - 12.7, hence each coordinate is +/-10.16 mm. Top-view
    orientation follows the drawing (header edge at bottom) and native EAGLE +Y points
    up; no rotation or reflection is required. Hole diameters are not dimensioned
    on the drawing; they are taken from the pinned native CAD, where JP2, JP3, JP8
    and JP9 each place a 3.302 mm non-plated hole in the named STAND-OFF package.
    The helper inspector cannot parse this CAD because it rejects two unrelated layer-20
    text labels; geometry is therefore recorded from the linked dimension drawing
    and corroborated against the complete raw board XML.
  fit_status: generic_holder_not_physical_fit_tested
  identity_evidence: SparkFun product page identifies SKU SEN-15805 and links the
    Eagle files, board dimensions, and GitHub Hardware Repo. The linked manufacturer
    repository README describes the product as TMP117 (Qwiic) and says Hardware contains
    Eagle board/schematic design files. The selected pinned Hardware/Sparkfun_TMP117_Qwiic.brd
    is that design file.
