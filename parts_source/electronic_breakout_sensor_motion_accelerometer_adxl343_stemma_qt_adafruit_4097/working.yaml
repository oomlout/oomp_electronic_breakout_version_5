  derivation: 'EAGLE layer-20 outline runs from x=0 to 25.4 mm and y=0 to 17.78 mm,
    including the four 2.54 mm corner arcs; bounding-box centre is (12.7, 8.89) mm.
    Selected plated package drills are at raw CAD positions (2.54,15.24), (22.86,15.24),
    (2.54,2.54), (22.86,2.54) mm. Subtract centre: x=2.54−12.7=−10.16 or 22.86−12.7=10.16
    mm; y=15.24−8.89=6.35 or 2.54−8.89=−6.35 mm. Each selected pad drill is 2.5 mm.
    Keep native orientation (quarter-turn 0), giving the required top-view centred
    right/up coordinates.'
