mounting_research:
  board_revision: Espressif ESP32-C6-DevKitM-1 Rev 1.0 carrier; ordering variant ESP32-C6-DevKitM-1-N4
    with ESP32-C6-MINI-1, 4 MB flash. PCB layout title block
  board_size:
  - 25.4
  - 48.26
  coordinate_system:
    origin: pcb_bounding_box_centre
    units: mm
    view: top
    x_positive: right
    y_positive: up
  derivation: 'Use the manufacturer dimension drawing directly: 25.400 mm wide x 48.260
    mm high (Unit:mm), PCB outline excluding module antenna overhang and connector
    protrusion. The drawing is a top view with USB connectors at the bottom. Canonical
    coordinates are centred on the PCB bounding box: x = X_drawing - 12.700 mm; y
    = 24.130 mm - Y_drawing, so +x points right and +y points up/away from USB. Reviewed
    the complete five-page Rev 1.0 PCB Layout drawing across copper, silkscreen/assembly
    and composite sheets. Candidate drills are J1/J3 electrical header holes, J5 current-measurement
    header pads, and the USB/UART connector retention anchors identified by their
    locations and silkscreen; none is a PCB mounting hole. The carrier drawings show
    no dedicated board-mount pattern, so mounting_holes is explicitly empty.'
  fit_status: generic_holder_not_physical_fit_tested
  identity_evidence: Espressif's ESP32-C6-DevKitM-1 user guide identifies the exact
    N4 orderable variant and links its PCB Layout and Dimensions drawings. The linked
    PCB Layout title block names ESP32-C6-DevKitM-1 Rev 1.0 (#38294); the archived
    dimensions drawing is the matching DevKitM-1 carrier outline.
  mounting_holes: []
  record_sha256: a97c987a7d11788363392887d56e9d7afc8ebf7c9381e88a2cc4a6e9fbf9d9e1
  research_file: source_file/electronic_breakout_microcontroller_esp32_c6_mini_1_n4_devkitm_1_30_pin_25_4_mm_width_53_65_mm_height_30_pins_espressif_esp32_c6_devkitm_1_n4/mounting.yaml
  reviewed_by: gpt-6-luna
  sources:
