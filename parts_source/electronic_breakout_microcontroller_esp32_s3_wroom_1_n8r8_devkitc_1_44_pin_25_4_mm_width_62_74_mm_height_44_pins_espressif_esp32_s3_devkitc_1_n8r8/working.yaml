mounting_research:
  board_revision: Espressif ESP32-S3-DevKitC-1 carrier Rev 1.1 (2022-04-29 drawing);
    assigned catalogue module variant ESP32-S3-WROOM-1-N8R8. The current manufacturer
    guide ordering table does not enumerate N8R8, so the revision claim applies to
    the shared DevKitC-1 carrier layout.
  board_size:
  - 25.4
  - 62.74
  coordinate_system:
    origin: pcb_bounding_box_centre
    units: mm
    view: top
    x_positive: right
    y_positive: up
  derivation: The complete manufacturer top-view dimension drawing labels the PCB
    outline 25.40 mm wide and 62.74 mm high. The 62.74 mm arrow spans the carrier
    PCB top and bottom edges; the antenna module and both USB connectors extend beyond
    these board edges and are excluded. The drawing top view has x increasing right
    and y increasing toward the antenna end (USB connectors at the opposite end).
    Translate drawing coordinates to the required centred PCB frame with x_mm = X_drawing
    - 25.40/2 = X_drawing - 12.70 mm and y_mm = Y_drawing - 62.74/2 = Y_drawing -
    31.37 mm; no rotation, reflection or axis swap. Reviewed the complete dimension
    sheet and every page of the official Rev 1.1 PCB layout. Candidate drilled features
    are the two 22-contact side-header rows J1/J3 (the official guide identifies these
    as pin headers), module contact/via features, and J2/J4 USB connector contact
    and retention features. They are electrical contacts, vias or connector anchors,
    not PCB mounting holes. The complete layout shows no discrete board mounting bores
    or mounting pattern; the mounting hole list is therefore explicitly empty.
  fit_status: generic_holder_not_physical_fit_tested
  identity_evidence: The official Espressif v1.1 user guide names ESP32-S3-DevKitC-1
    v1.1 and links the ESP32-S3-DevKitC-1 Dimensions and PCB layout documents. The
    complete dimension PDF and all five pages of PCB_ESP32-S3-DevKitC-1_V1.1_20220429.pdf
    carry the exact carrier title and Rev 1.1 date 2022-04-29. These establish the
    assigned DevKitC-1 carrier revision; the guide's current ordering table does not
    list N8R8 specifically.
