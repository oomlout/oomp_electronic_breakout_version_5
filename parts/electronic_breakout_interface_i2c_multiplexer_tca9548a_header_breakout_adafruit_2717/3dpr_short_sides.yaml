    I2C Multiplexer. The official Adafruit-TCA9548A-I2C-Multiplexer-PCB repository
    README names the same product and links product 2717; its pinned Adafruit TCA9548A.brd
    CAD matches the revision-C guide fabrication print in the plain layer-20 rectangular
    outline and two mounting sites. The guide drawing page 25 title block is TCA9548A_REV-C.
