    origin: pcb_bounding_box_centre
    units: mm
    view: top
    x_positive: right
    y_positive: up
  derivation: 'Adafruit guide PDF page 26 fabrication print is reviewed in top view.
    Drawing calls board outline 0.7 in x 1.2 in, hole-centre spacing 1.0 in, hole
    horizontal centreline at 0.35 in from left edge (centred), lower hole centre setback
    0.1 in from bottom edge, and nominal hole diameter 0.1 in. Convert outline: 0.7*25.4=17.78
    mm, 1.2*25.4=30.48 mm. Drawing centre spacing: 1.0*25.4=25.4 mm, hence centred
    y positions +/-25.4/2=+/-12.7 mm. X coordinate: 0.35*25.4 - 17.78/2 = 0 mm. The
    drawing nominal drill 0.1*25.4=2.54 mm is rounded; the exact associated CAD packages
    U$4 and U$5 (MOUNTINGHOLE_2.5_PLATED) each specify pad drill 2.5 mm, retained
    as the exact PCB drill diameter. CAD board bounds are x=0..17.78 and y=0..30.48
    mm, with sites at (8.89,2.54) and (8.89,27.94) mm. Translate to the bounding-box
    centre by subtracting (8.89,15.24), giving (0,-12.7) and (0,+12.7) mm. Axis transform:
    native CAD top-view mm, x right/y up; subtract native bounding-box centre (8.89,15.24),
    no rotation/reflection, resulting in canonical centred top-view axes. The drawing
    fallback is used because the exact XML CAD layer 20 contains dimension annotation
    entities that the current Eagle helper rejects; no source file was altered.'
  fit_status: generic_holder_not_physical_fit_tested
