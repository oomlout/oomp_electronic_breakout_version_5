        \ 0 has native bounds approximately x=-0.009..18.009, y=-0.014..23.509 mm\
        \ due CAD tolerance. Reviewed all 25 cylindrical faces on solid 0: 23 \xC3\
        \u02DC0.900 mm through-hole header-contact drills in the two side rows and\
        \ bottom edge array, plus two \xC3\u02DC0.700 mm connector anchor features\
        \ at native x\xE2\u2030\u02C66.100/11.880, y\xE2\u2030\u02C618.272 mm associated\
        \ with the USB connector. These are electrical header pads or connector anchors,\
        \ not board mounting holes. Complete board solid has no remaining discrete\
        \ mounting-hole candidate. The standard-hole list is explicitly empty."
