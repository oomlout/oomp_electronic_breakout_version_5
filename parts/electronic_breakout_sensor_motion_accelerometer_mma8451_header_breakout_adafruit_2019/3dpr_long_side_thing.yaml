  derivation: The complete EAGLE layer-20 outline comprises four straight edges and
    four 2.54 mm corner arcs, with native bounds x=[0,20.32] mm and y=[0,17.78] mm.
    Thus the bounding-box board size is [20.32,17.78] mm and native centre is (10.16,8.89)
    mm. Convert each native top-view position using x_mm=x_native-10.16 and y_mm=y_native-8.89;
    no rotation or mirror is applied (quarter_turn=0). U$3 and U$6 are placed at native
    (2.54,15.24) mm and (17.78,15.24) mm, respectively, giving centred (-7.62,6.35)
    mm and (7.62,6.35) mm. Both selected features are pads in the explicitly named
    MOUNTINGHOLE_2.5_PLATED package, whose P$1 drill is 2.5 mm and pad diameter is
    3.2 mm. The full drill review also found eight 1.0 mm JP1 header pad drills; they
    are electrical header pads, not mounting holes. The product listing's nominal
    21 x 18 mm overall size is rounded and was not substituted for the exact EAGLE
    outline dimensions.
  fit_status: generic_holder_not_physical_fit_tested
  identity_evidence: Adafruit product 2019 is the MMA8451 accelerometer breakout and
    states two 2.5 mm mounting holes. The official Adafruit MMA8451-Breakout-PCB repository
    README describes its board files as the Adafruit MMA8451 Breakout and links product
    2019; the Downloads section of the official product guide links the EagleCAD PCB
    files on GitHub. The pinned repository snapshot contains the exact file Adafruit
    MMA8451.brd. The CAD is therefore linked to the catalogue carrier, while the limitation
    on historical production revisions remains.
