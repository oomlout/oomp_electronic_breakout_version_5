mounting_research:
    board_revision: Seeed Studio XIAO RP2040, SKU 102010428; current manufacturer-linked
        Eagle project is v1.22. Cross-checked against the archived Seeed KiCad v1.3
        project dated 2026-03-04; both agree on the mechanical outline and component-drill
        roles.
    board_size:
    - 17.78
    - 21.1016
    coordinate_system:
        origin: pcb_bounding_box_centre
        units: mm
        view: top
        x_positive: right
        y_positive: up
    derivation: 'Drawing fallback: Seeed manufacturer PDF page 3 identifies SKU 102010428
        and gives nominal board dimensions 17.8 mm wide x 21 mm high, with the USB
        connector at the top. The current official Eagle v1.22 board layer 20 gives
        the complete outline bounds x=[-10.1016, 11] mm, y=[-8.89, 8.89] mm, hence
        native dimensions 21.1016 x 17.78 mm. Center native CAD origin at (0.4492,
        0) mm and rotate CCW 90 degrees: (x_top,y_top)=(-(y_native-0), x_native-0.4492);
        this yields canonical width=17.78 mm, height=21.1016 mm, top view with USB
        at +Y. The PDF rounds these to 17.8 x 21 mm. Full Eagle board has no board-level
        plain holes. Reviewed every drilled package feature: J2/J4 are 14-pin half-hole
        connector/header pads; USB1 has connector retention/shell anchors; RESET and
        BOOT have switch retention holes; J1 holes are shielding-cover retention anchors.
        These component/connector features are not board mounting holes. The complete
        v1.3 KiCad board archive is byte-verified against its extracted board and
        agrees on dimensions and feature roles. Eagle helper extraction was attempted
        but rejects the J1 footprint because it includes layer-20 geometry; dimensions
        and all candidates were therefore reviewed from the registered exact CAD plus
        the manufacturer dimension drawing.'
    fit_status: generic_holder_not_physical_fit_tested
    identity_evidence: The official Seeed XIAO RP2040 product page distinguishes the
        standard RP2040 from the RP2040 Plus and publishes the 21 x 17.8 mm dimensions.
        Seeed SKU 102010428 is explicit on drawing page 3. The official Wiki links
        the v1.22 Eagle project, whose board file identifies XIAO RP2040 v1.22; the
        archived manufacturer KiCad project names XIAO RP2040 v1.3. Both complete
        CAD files describe this carrier and agree on the board outline.
