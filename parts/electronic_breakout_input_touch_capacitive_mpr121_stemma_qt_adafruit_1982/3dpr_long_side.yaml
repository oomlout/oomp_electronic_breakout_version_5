    origin: pcb_bounding_box_centre
    units: mm
    view: top
    x_positive: right
    y_positive: up
  derivation: 'Extracted the unmodified layer 20 outline from the pinned Eagle CAD
    (native mm). Outline extrema are x=0..33.02 and y=-0.127..19.05, hence bounding
    box 33.02 x 19.177 mm and centre (16.51, 9.4615) mm. No rotation/reflection: canonical
    top view x_mm = native_x_mm - 16.51; y_mm = native_y_mm - 9.4615; quarter_turn=0.
    Hole centres in native CAD were transformed by that translation. Full drill review
    found 22 drilled candidates: JP1 and JP2 are through-hole header contact rows
    (20 x 1.0 mm drill), and U$34/U$35 are the only two footprints explicitly named
    MOUNTINGHOLE_2.5_PLATED (2 x 2.5 mm drill), selected as mounting holes.'
  fit_status: generic_holder_not_physical_fit_tested
  identity_evidence: Adafruit product 1982 page identifies the MPR121 STEMMA QT board
    and dates the QT revision. The official pinned Adafruit-MPR121-PCB README links
    this repository to product 1982 and identifies EagleCAD board files; the repository
    contains the exact file Adafruit MPR121Q QT.brd, distinct from Adafruit MPR121Q
    QT Gator Breakout.brd (product 4830).
