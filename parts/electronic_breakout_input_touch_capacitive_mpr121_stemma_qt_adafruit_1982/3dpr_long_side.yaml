  board_revision: Adafruit MPR121Q QT STEMMA QT carrier, product 1982, STEMMA QT revision
    introduced 2021-01-21; pinned Eagle board source added to Adafruit-MPR121-PCB
    on 2021-01-26. Product page says size and two mounting-hole locations did not
    change in the revision.
  board_size:
  - 33.02
