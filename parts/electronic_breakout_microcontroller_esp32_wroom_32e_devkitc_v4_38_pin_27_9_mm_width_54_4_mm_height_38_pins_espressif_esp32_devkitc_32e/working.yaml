mounting_research:
    board_revision: Espressif ESP32-DevKitC V4, ESP32-DevKitC-32E variant with ESP32-WROOM-32E;
        carrier revision explicitly identified as V4 by manufacturer.
    board_size:
    - 27.94
    - 48.26
    coordinate_system:
        origin: pcb_bounding_box_centre
        units: mm
        view: top
        x_positive: right
        y_positive: up
    derivation: "The official ESP32-DevKitC V4 dimension drawing states the bare carrier\
        \ PCB outline is 27.94 mm wide \xD7 48.26 mm high. Dimensions are recorded\
        \ as width, height in mm. The drawing is top view with the RF antenna/module\
        \ end at the top and Micro-USB connector at the bottom; canonical x points\
        \ right and y points up, so the drawing maps directly to the centred top-view\
        \ frame with origin at (13.97, 24.13) mm from its lower-left PCB bound, with\
        \ no axis swap, rotation, or reflection. Reviewed the complete manufacturer\
        \ dimension sheet and all six pages of the manufacturer V4 PCB layout, including\
        \ the drill depiction. The 38 large through holes are the two 19-pin I/O header\
        \ rows, the four oblong USB receptacle shell anchors are connector retention\
        \ features, the adjacent small drills are USB connector contacts, and the\
        \ other small plated drills are circuit vias/components. None is a board mounting\
        \ hole; the complete carrier drawing and layout show no designated board mounting\
        \ pattern."
    fit_status: generic_holder_not_physical_fit_tested
    identity_evidence: "Espressif\u2019s ESP32-DevKitC V4 user guide names the V4\
        \ carrier and its ordering table maps ESP32-DevKitC-32E to ESP32-WROOM-32E.\
        \ The archived V4 dimension drawing and six-page V4 PCB layout are both linked\
        \ by that manufacturer guide."
    mounting_holes: []
    record_sha256: ae890e7d91d187fa81bb9c7e745d0e648a82fe054f610a4fa0a3883b70b1e058
