  board_revision: Adafruit ADS1115 ADC STEMMA QT carrier layout added to the official
    ADS1X15-Breakout-Board-PCBs repository on 2022-06-29; exact archived file Adafruit
    ADS1115 ADC STEMMA QT.brd at commit ceecefb983878a3df33a4dc5e04968b0f2cd6f03.
    Product listing identifies product 1085 as the ADS1115 STEMMA QT variant. No separate
    silkscreen revision was established.
  board_size:
  - 25.4
  - 17.78
  coordinate_system:
    origin: pcb_bounding_box_centre
    units: mm
    view: top
    x_positive: right
    y_positive: up
  derivation: 'Complete EAGLE layer-20 outline has native bounds x=[0,25.4] mm and
    y=[0,17.78] mm, including four 2.54 mm corner arcs. Thus board_size=[25.4,17.78]
    mm and native bounding-box centre=(12.7,8.89) mm. Transform native EAGLE coordinates
    to the canonical top view by x_mm=x_native-12.7 and y_mm=y_native-8.89; no quarter-turn
    or mirror is applied (quarter_turn=0). The full drill review found 16 candidates:
    JP1/JP2 are 1.0 mm 1x06 header pads and are excluded; the four 2.5 mm drills belong
    to U$25/U$27/U$29/U$30, each package explicitly named MOUNTINGHOLE_2.5_PLATED
    with value MOUNTINGHOLE2.5, and are the four board mounting holes. Two fiducials
    are separate board features and have no drills.'
  fit_status: generic_holder_not_physical_fit_tested
  identity_evidence: The Adafruit product page identifies product 1085 as the ADS1115
    STEMMA QT breakout; the official guide Downloads page links the Adafruit ADS1X15-Breakout-Board-PCBs
    repository; its pinned June 29, 2022 commit adds the specifically named Adafruit
    ADS1115 ADC STEMMA QT.brd file. The pinned repository README says these EAGLE
    layouts cover ADS1015 and ADS1115. Product page states four mounting holes, matching
    the four named mounting-hole packages in the CAD.
